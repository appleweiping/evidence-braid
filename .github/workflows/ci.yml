name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=evidence_braid --cov-report=term-missing
      - name: Smoke-test fixed-time evaluation
        # `$DECISION_OUTPUT` is bash syntax. Without an explicit shell the Windows
        # runner uses PowerShell, where it expands to nothing and the command runs
        # with an empty --output.
        shell: bash
        env:
          DECISION_OUTPUT: ${{ runner.temp }}/decision.json
        run: evidence-braid evaluate examples/policy.json examples/events.jsonl --as-of 2026-08-31T12:00:00Z --output "$DECISION_OUTPUT"
      - name: Smoke-test synthetic evaluation protocol
        if: runner.os == 'Linux' && matrix.python-version == '3.14'
        env:
          SYNTHETIC_OUTPUT: ${{ runner.temp }}/synthetic-evaluation.json
        run: python experiments/synthetic_baselines.py --samples 12 --repeats 3 --replay-events 8 --output "$SYNTHETIC_OUTPUT"
      - name: Build distributions
        run: python -m build
      - name: Smoke-test the isolated wheel
        if: runner.os == 'Linux'
        run: |
          python -m venv /tmp/evidence-braid-wheel
          /tmp/evidence-braid-wheel/bin/python -m pip install --no-index dist/*.whl
          cd /tmp
          /tmp/evidence-braid-wheel/bin/evidence-braid evaluate "$GITHUB_WORKSPACE/examples/policy.json" "$GITHUB_WORKSPACE/examples/events.jsonl" --as-of 2026-08-31T12:00:00Z --output decision-from-wheel.json
          /tmp/evidence-braid-wheel/bin/python -c "import json; assert json.load(open('decision-from-wheel.json', encoding='utf-8'))['policy_id'] == 'operations-demo-v1'"

  gate:
    name: CI gate
    if: ${{ always() }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every matrix job to succeed
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
        run: test "${MATRIX_RESULT}" = success
