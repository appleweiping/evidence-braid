name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=evidence_braid --cov-report=term-missing
      - run: evidence-braid evaluate examples/policy.json examples/events.jsonl --as-of 2026-08-31T12:00:00Z --output "${{ runner.temp }}/decision.json"
      - name: Build distributions
        run: python -m build
      - name: Smoke-test the isolated wheel
        if: runner.os == 'Linux'
        run: |
          python -m venv /tmp/evidence-braid-wheel
          /tmp/evidence-braid-wheel/bin/python -m pip install --no-index dist/*.whl
          cd /tmp
          /tmp/evidence-braid-wheel/bin/evidence-braid evaluate "$GITHUB_WORKSPACE/examples/policy.json" "$GITHUB_WORKSPACE/examples/events.jsonl" --as-of 2026-08-31T12:00:00Z --output decision-from-wheel.json
          /tmp/evidence-braid-wheel/bin/python -c "import json; assert json.load(open('decision-from-wheel.json', encoding='utf-8'))['policy_id'] == 'operations-demo-v1'"
