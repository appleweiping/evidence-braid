[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "evidence-braid"
version = "0.2.0"
description = "Deterministic, auditable multimodal evidence fusion and escalation decisions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "appleweiping" }]
maintainers = [{ name = "appleweiping" }]
keywords = ["decision-support", "multimodal", "evidence", "audit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.15",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.9",
  "twine>=7.0",
]

[project.scripts]
evidence-braid = "evidence_braid.cli:main"

[project.urls]
Documentation = "https://github.com/appleweiping/evidence-braid#readme"
Issues = "https://github.com/appleweiping/evidence-braid/issues"
Source = "https://github.com/appleweiping/evidence-braid"

[tool.hatch.build.targets.wheel]
packages = ["src/evidence_braid"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
# tests/test_experiments.py imports the repo-root `experiments` package, which is
# not installed with the distribution. Without this, collection only succeeds when
# pytest is started as `python -m pytest` (which puts the working directory on
# sys.path); a bare `pytest` invocation, as used in CI, fails to import it.
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["evidence_braid"]

[tool.coverage.report]
fail_under = 98
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/evidence_braid/report.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
